<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mTitle">
  <title id="mTitle">Momentum</title>
  <defs>
    <linearGradient id="mGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#6B84FF"/>
      <stop offset="1" stop-color="#4A8CFF"/>
    </linearGradient>
  </defs>

  <!-- подложка-сквиркл -->
  <rect width="512" height="512" rx="118" ry="118" fill="#0A0C12"/>

  <!--
    Сегментное кольцо: 8 дуг, шаг 62 / 49.53, обводка 38.

    Сдвиг начала штриховки сделан через stroke-dashoffset, а не через
    transform="rotate(-102.5)". Оба варианта дают одинаковое расположение
    дуг, но transform поворачивает и систему координат градиента вместе с
    элементом: ось уезжает на 102,5° и вместо «снизу-слева вверх-вправо»
    получается «снизу-справа вверх-влево». Проверено рендером.
    dashoffset двигает только штриховку, ось градиента остаётся заданной.

    254.03 = 102,5° / 360° × 2π × 142.
  -->
  <circle cx="256" cy="256" r="142"
          fill="none"
          stroke="url(#mGrad)"
          stroke-width="38"
          stroke-linecap="round"
          stroke-dasharray="62 49.53"
          stroke-dashoffset="254.03"/>
</svg>
