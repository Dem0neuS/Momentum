<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="mTitle">
  <title id="mTitle">Momentum</title>
  <defs>
    <linearGradient id="mGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#6B84FF"/>
      <stop offset="1" stop-color="#4A8CFF"/>
    </linearGradient>
  </defs>

  <!-- светлая версия: белая подложка, градиент и геометрия без изменений -->
  <rect width="512" height="512" rx="118" ry="118" fill="#FFFFFF"/>

  <circle cx="256" cy="256" r="142"
          fill="none"
          stroke="url(#mGrad)"
          stroke-width="38"
          stroke-linecap="round"
          stroke-dasharray="62 49.53"
          stroke-dashoffset="254.03"/>
</svg>
