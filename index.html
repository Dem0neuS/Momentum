<!doctype html>
<html lang="ru" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <!-- Моно-знак: currentColor наследует цвет текста, поэтому одна иконка
         работает и в светлой, и в тёмной теме. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0C12" />
    <meta name="description" content="Momentum — твой день. Твой ритм. Твой прогресс." />
    <title>Momentum — твой день, твой ритм, твой прогресс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Применяем тему до отрисовки, чтобы не было мигания.
      try {
        var storedTheme = localStorage.getItem('momentum:theme');
        var theme = storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system'
          ? storedTheme
          : 'system';
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolvedDark = theme === 'dark' || (theme === 'system' && systemDark);

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeResolved = resolvedDark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', resolvedDark ? '#0A0C12' : '#F5F6FA');
      } catch (error) {
        document.documentElement.dataset.theme = 'system';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
