name: Сборка и публикация

# Публикация никогда не запускается сама: только вручную, кнопкой Run workflow.
# Дополнительно нужен явный флажок publish — два действия, чтобы релиз ушёл.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз в GitHub Releases
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы и собрать фронтенд
        # Ключи кабинета впечатываются в бандл на сборке. Публиковать релиз
        # без них можно, но такой .exe не умеет вход, и исправить это можно
        # будет только новой версией: electron-updater не умеет откат.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Проверить, настроен ли кабинет
        # shell: bash обязателен: job собирается на windows-latest, где
        # оболочкой по умолчанию PowerShell, а синтаксис if [ -n ... ] там не
        # разбирается и шаг падает вместо предупреждения.
        shell: bash
        env:
          HAS_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node -e "console.log('версия:', require('./package.json').version)"
          if [ -n "$HAS_URL" ]; then
            echo "Кабинет в сборке настроен."
          else
            echo "::warning::Секрет VITE_SUPABASE_URL не задан — в .exe кабинет не работает, вместо форм входа будет подсказка."
          fi

      - name: Убедиться, что тег релиза есть
        # electron-builder публикует через API и сам тег не создаёт — это умеет
        # только git-провайдер. Без тега POST /releases всё равно создаёт его
        # из target_commitish, но полагаться на это нельзя: тег должен указывать
        # ровно на тот коммит, из которого собраны файлы. Ставим его заранее.
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже есть — публикуем в него."
          else
            git tag -a "$TAG" -m "Momentum $VERSION"
            git push origin "$TAG"
            echo "Создан тег $TAG на $(git rev-parse --short HEAD)."
          fi

      - name: Собрать установщик и опубликовать
        # Публикует ровно одна цель — nsis. electron-builder держит кэш
        # publisher'ов по конфигурации публикации, и на nsis + portable их
        # получается два: каждый создаёт релиз сам и в обоих случаях в лог
        # идёт «creating GitHub release». Второй POST проигрывает гонку и
        # получает 422 «Published releases must have a valid tag», потому что
        # релиз и тег к этому моменту уже созданы первым. Побочный эффект хуже
        # самой ошибки: загрузки от проигравшего отменяются, и релиз остаётся
        # неполным. На 1.0.1 так потерялся .blockmap — без него
        # electron-updater не может качать обновление частями.
        # Portable поэтому собирается отдельно и догружается шагом ниже.
        #
        # electron-builder дописывает в app-update.yml данные репозитория
        # из секции build.publish — их читает electron-updater в приложении.
        # releaseType: release в package.json нужен, чтобы релиз не остался
        # черновиком: черновик не виден в releases/latest, на который
        # ведут кнопки страницы загрузки.
        if: ${{ inputs.publish }}
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать переносимую версию
        # Без публикации: релиз к этому моменту уже создан предыдущим шагом.
        if: ${{ inputs.publish }}
        run: npx electron-builder --win portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Догрузить переносимую версию в релиз
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" release/Momentum-*-portable.exe --clobber --repo "$GITHUB_REPOSITORY"
          echo "Переносимая версия добавлена в $TAG."

      - name: Собрать установщик без публикации
        if: ${{ !inputs.publish }}
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Готово без публикации
        if: ${{ !inputs.publish }}
        run: echo "Сборка лежит в release/. Флажок publish не был установлен — релиз не создан."

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: Momentum-windows-x64
          path: |
            release/Momentum-*-setup.exe
            release/Momentum-*-portable.exe
          if-no-files-found: error
          retention-days: 14
