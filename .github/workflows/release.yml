name: Сборка и публикация

# Публикация никогда не запускается сама: только вручную, кнопкой Run workflow.
# Дополнительно нужен явный флажок publish — два действия, чтобы релиз ушёл.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз в GitHub Releases
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы и собрать фронтенд
        # Ключи кабинета впечатываются в бандл на сборке. Публиковать релиз
        # без них можно, но такой .exe не умеет вход, и исправить это можно
        # будет только новой версией: electron-updater не умеет откат.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Проверить, настроен ли кабинет
        # shell: bash обязателен: job собирается на windows-latest, где
        # оболочкой по умолчанию PowerShell, а синтаксис if [ -n ... ] там не
        # разбирается и шаг падает вместо предупреждения.
        shell: bash
        env:
          HAS_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          node -e "console.log('версия:', require('./package.json').version)"
          if [ -n "$HAS_URL" ]; then
            echo "Кабинет в сборке настроен."
          else
            echo "::warning::Секрет VITE_SUPABASE_URL не задан — в .exe кабинет не работает, вместо форм входа будет подсказка."
          fi

      - name: Убедиться, что тег релиза есть
        # electron-builder публикует через API и сам тег не создаёт — это умеет
        # только git-провайдер. Без тега POST /releases всё равно создаёт его
        # из target_commitish, но полагаться на это нельзя: тег должен указывать
        # ровно на тот коммит, из которого собраны файлы. Ставим его заранее.
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # Образ runner'а приходит без git identity, и `git tag -a` падает с
          # "Committer identity unknown" — релиз 1.0.2 так и не собрался.
          # Задаём её в этом репозитории: тег указывает на коммит, а не на
          # анонимного пользователя машины.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Тег $TAG уже есть — публикуем в него."
          else
            git tag -a "$TAG" -m "Momentum $VERSION"
            git push origin "$TAG"
            echo "Создан тег $TAG на $(git rev-parse --short HEAD)."
          fi

      - name: Собрать установщик и переносимую версию
        # Публикацией занимается не electron-builder, а gh ниже. Причина —
        # гонка: сколько бы целей ни оставалось в этом шаге, electron-builder
        # держит кэш publisher'ов по конфигурации публикации, и на релиз
        # 1.0.2 пришлось ровно два — оба печатают «creating GitHub release».
        # Второй POST проигрывает и получает 422 «Published releases must
        # have a valid tag», а его загрузки отменяются: релиз остаётся
        # неполным. Так на 1.0.1 потерялся .blockmap, и то же повторилось на
        # 1.0.2 — electron-builder отменил загрузку blockmap, а она шла
        # первой. Одной цели вместо двух не помогает: гонка и на `--win nsis`.
        #
        # Побочно уходит и другое ограничение electron-builder: релиз
        # опубликованный больше двух часов назад он догружать отказывается
        # («existing release published more than 2 hours ago»), и публикация
        # молча пропускается. У gh такого правила нет.
        #
        # electron-builder дописывает в app-update.yml данные репозитория
        # из секции build.publish — их читает electron-updater в приложении,
        # поэтому публиковать через gh безопасно.
        if: ${{ inputs.publish }}
        run: npx electron-builder --win nsis portable --publish never

      - name: Создать релиз
        # Релиз создаётся до загрузки файлов и ровно один раз: два POST
        # /releases из одного прогона и есть та самая гонка. Создавать
        # нужно опубликованным, а не черновиком: на releases/latest ведут
        # кнопки страницы загрузки, черновик там не виден.
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $TAG уже есть — файлы догружаются в него."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Momentum $(node -p "require('./package.json').version")" \
              --generate-notes
            echo "Создан релиз $TAG."
          fi

      - name: Загрузить файлы в релиз
        # Momentum-* покрывает установщик, переносимую версию и .blockmap
        # (его имя выводится из имени установщика), latest.yml лежит рядом
        # и под шаблон не попадает — его указываем отдельно.
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" release/Momentum-* release/latest.yml \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Файлы релиза $TAG загружены."

      - name: Собрать установщик без публикации
        if: ${{ !inputs.publish }}
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Готово без публикации
        if: ${{ !inputs.publish }}
        run: echo "Сборка лежит в release/. Флажок publish не был установлен — релиз не создан."

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: Momentum-windows-x64
          path: |
            release/Momentum-*-setup.exe
            release/Momentum-*-portable.exe
          if-no-files-found: error
          retention-days: 14
